[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codewalk-python-parser"
version = "0.1.0"
description = "Dependency-free deterministic Python parser adapter for Codewalk"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
codewalk-python-parser = "python_parser:main"
